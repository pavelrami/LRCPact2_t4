<h1>Información de la materia</h1>

<ul>
    <li>
        <strong>ID:</strong>
        <span th:text="${materia.id}"></span>
    </li>
    <li>
        <strong>Nombre:</strong>
        <span th:text="${materia.nombre}"></span>
    </li>
    <li>
        <strong>Categoría:</strong>
        <span th:text="${materia.categoria}"></span>
    </li>
    <li>
        <strong>Semestre:</strong>
        <span th:text="${materia.semestre}"></span>
    </li>
    <li>
        <strong>Descripción:</strong>
        <span th:text="${materia.descripcion}"></span>
    </li>
</ul>

<a th:href="@{/mvc/materias}">Volver a la lista</a>
