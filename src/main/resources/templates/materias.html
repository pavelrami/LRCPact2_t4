<h1>Lista de materias</h1>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Semestre</th>
            <th>Acción</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="materia : ${materias}">
            <td th:text="${materia.id}"></td>
            <td th:text="${materia.nombre}"></td>
            <td th:text="${materia.categoria}"></td>
            <td th:text="${materia.semestre}"></td>
            <td>
                <a th:href="@{/mvc/materias/{id}(id=${materia.id})}">
                    Ver detalle
                </a>
            </td>
        </tr>
    </tbody>
</table>
